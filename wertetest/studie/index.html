/* ════════════════════════════════════════════════════════════════════
   SUPABASE HELPER (gleicher Helper wie im Wertetest)
   ════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = window.SUPABASE_URL;
const SUPABASE_KEY = window.SUPABASE_KEY;

async function supaFetch(path, options = {}) {
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    ...(options.headers || {}),
  };
  const r = await fetch(`${SUPABASE_URL}${path}`, { ...options, headers });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`Supabase ${r.status}: ${txt}`);
  }
  if (r.status === 204) return null;
  return r.json();
}

const supa = {
  selectWhere(table, columns, filters) {
    const params = new URLSearchParams();
    params.set("select", columns || "*");
    Object.entries(filters || {}).forEach(([k, v]) => params.set(k, `eq.${v}`));
    return supaFetch(`/rest/v1/${table}?${params.toString()}`);
  },
  insertReturning(table, row) {
    return supaFetch(`/rest/v1/${table}`, {
      method: "POST",
      headers: { "Prefer": "return=representation" },
      body: JSON.stringify(row),
    }).then(r => r[0]);
  },
  update(table, filters, patch) {
    const params = new URLSearchParams();
    Object.entries(filters || {}).forEach(([k, v]) => params.set(k, `eq.${v}`));
    return supaFetch(`/rest/v1/${table}?${params.toString()}`, {
      method: "PATCH",
      headers: { "Prefer": "return=representation" },
      body: JSON.stringify(patch),
    });
  },
};

/* ════════════════════════════════════════════════════════════════════
   ITEM RENDERER — Slider, Likert, Radio, Open, Number, Scale11
   ════════════════════════════════════════════════════════════════════ */

function ItemSlider100({ item, value, onChange, hints }) {
  const v = value != null ? value : 50;
  const labels = item.sliderHints || hints || { left: "0", right: "100" };
  const touched = value != null;
  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ position: "relative", padding: "20px 0 6px" }}>
        <div style={{
          position: "absolute", left: `${v}%`, top: 0,
          transform: "translateX(-50%)",
          background: COL.blue, color: "#fff",
          padding: "3px 10px", borderRadius: 12, fontSize: 13, fontWeight: 700,
          transition: "left 0.1s linear",
          opacity: touched ? 1 : 0.4,
        }}>{v}</div>
        <input type="range" min={0} max={100} step={1}
          value={v}
          onChange={e => onChange(parseInt(e.target.value, 10))}
        />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: COL.textLight, marginTop: 4 }}>
        <span>{labels.left}</span>
        <span>{labels.right}</span>
      </div>
    </div>
  );
}

function ItemLikert({ item, value, onChange, hints, scale }) {
  const n = scale; // 4, 5 oder 7
  const labels = item.likertHints || hints || {};
  const buttons = Array.from({ length: n }, (_, i) => i + 1);
  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ display: "flex", gap: 6, justifyContent: "space-between" }}>
        {buttons.map(b => {
          const selected = value === b;
          return (
            <button key={b} onClick={() => onChange(b)} style={{
              flex: 1, padding: "12px 4px",
              border: selected ? `2px solid ${COL.blue}` : `2px solid ${COL.border}`,
              background: selected ? COL.blue : "#fff",
              color: selected ? "#fff" : COL.text,
              borderRadius: 10, cursor: "pointer",
              fontSize: 14, fontWeight: 700,
              transition: "all 0.15s ease",
            }}>{b}</button>
          );
        })}
      </div>
      {labels.labels ? (
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: COL.textLight, marginTop: 6, gap: 4 }}>
          {labels.labels.map((lbl, i) => (
            <span key={i} style={{ flex: 1, textAlign: i === 0 ? "left" : i === labels.labels.length - 1 ? "right" : "center", lineHeight: 1.2 }}>{lbl}</span>
          ))}
        </div>
      ) : (
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: COL.textLight, marginTop: 6 }}>
          <span>{labels.left || "1"}</span>
          <span>{labels.right || n}</span>
        </div>
      )}
    </div>
  );
}

function ItemRadio({ item, value, onChange, otherValue, onOtherChange }) {
  return (
    <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
      {item.options.map(opt => {
        const selected = value === opt.value;
        return (
          <button key={String(opt.value)} onClick={() => onChange(opt.value)} style={{
            padding: "12px 16px",
            border: selected ? `2px solid ${COL.blue}` : `2px solid ${COL.border}`,
            background: selected ? "#eef2ff" : "#fff",
            color: COL.text, fontWeight: selected ? 700 : 500,
            borderRadius: 12, cursor: "pointer", textAlign: "left", fontSize: 14,
            transition: "all 0.15s ease",
          }}>
            <span style={{
              display: "inline-block", width: 16, height: 16, borderRadius: 99,
              border: selected ? `5px solid ${COL.blue}` : `2px solid ${COL.border}`,
              marginRight: 10, verticalAlign: "middle",
              background: selected ? "#fff" : "transparent",
            }} />
            {opt.label}
          </button>
        );
      })}
      {item.allowOther && value === "andere" && (
        <input type="text" value={otherValue || ""} onChange={e => onOtherChange(e.target.value)}
          placeholder={item.otherLabel || "Bitte eingeben…"}
          style={{
            padding: "10px 14px", border: `2px solid ${COL.border}`, borderRadius: 10,
            fontSize: 14, marginTop: 4,
          }}
        />
      )}
    </div>
  );
}

function ItemNumber({ item, value, onChange }) {
  return (
    <div style={{ marginTop: 14 }}>
      <input type="number" min={item.min} max={item.max}
        value={value != null ? value : ""}
        onChange={e => {
          const v = e.target.value;
          onChange(v === "" ? null : parseInt(v, 10));
        }}
        placeholder={item.placeholder || ""}
        style={{

}

function ItemOpen({ item, value, onChange }) {
  return (
    <div style={{ marginTop: 14 }}>
      <textarea value={value || ""} onChange={e => onChange(e.target.value)}
        placeholder={item.placeholder || ""}
        rows={4}
        style={{
          padding: "12px 16px", border: `2px solid ${COL.border}`, borderRadius: 12,
          fontSize: 15, width: "100%", resize: "vertical", lineHeight: 1.5,
          fontFamily: "inherit",
        }}
      />
    </div>

}

function ItemScale11({ item, value, onChange }) {
  const buttons = Array.from({ length: 11 }, (_, i) => i + 1);
  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ display: "flex", gap: 3, justifyContent: "space-between" }}>
        {buttons.map(b => {
          const selected = value === b;
          return (
            <button key={b} onClick={() => onChange(b)} style={{
              flex: 1, padding: "10px 0",
              border: selected ? `2px solid ${COL.blue}` : `2px solid ${COL.border}`,
              background: selected ? COL.blue : "#fff",
              color: selected ? "#fff" : COL.text,
              borderRadius: 8, cursor: "pointer",
              fontSize: 12, fontWeight: 700,
              minWidth: 0,
            }}>{b}</button>
          );
        })}
      </div>
      {item.labels && (
        <div style={{ marginTop: 8, fontSize: 11, color: COL.textLight, lineHeight: 1.4 }}>
          <div><strong>1:</strong> {item.labels.left}</div>
          <div><strong>6:</strong> {item.labels.middle}</div>
          <div><strong>11:</strong> {item.labels.right}</div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   ITEM CARD — Wrapper für einzelne Frage
   ════════════════════════════════════════════════════════════════════ */
function ItemCard({ item, value, onChange, sectionHints }) {
  const sub = item.help && (
    <div style={{ fontSize: 13, color: COL.textMuted, lineHeight: 1.5, marginTop: 4 }}>
      {item.help}
    </div>
  );

  let control = null;
  switch (item.type) {
    case "slider100":
      control = <ItemSlider100 item={item} value={value} onChange={onChange} hints={sectionHints} />;
      break;
    case "likert4":
      control = <ItemLikert item={item} value={value} onChange={onChange} hints={sectionHints} scale={4} />;
      break;
    case "likert5":
      control = <ItemLikert item={item} value={value} onChange={onChange} hints={sectionHints} scale={5} />;
      break;
    case "likert7":
      control = <ItemLikert item={item} value={value} onChange={onChange} hints={sectionHints} scale={7} />;
      break;
    case "radio":
      control = <ItemRadio item={item} value={value && value.main !== undefined ? value.main : value}
        onChange={v => onChange(item.allowOther ? { main: v, other: (value && value.other) || "" } : v)}
        otherValue={value && value.other}
        onOtherChange={v => onChange({ main: (value && value.main) || value, other: v })}
      />;
      break;
    case "number":
      control = <ItemNumber item={item} value={value} onChange={onChange} />;
      break;
    case "open":
      control = <ItemOpen item={item} value={value} onChange={onChange} />;
      break;
    case "scale11":
      control = <ItemScale11 item={item} value={value} onChange={onChange} />;
      break;
    default:
      control = <div style={{ color: "red" }}>Unbekannter Item-Typ: {item.type}</div>;
  }

  return (
    <div className="fade-in" style={{
      background: "#fff", padding: "18px 18px 20px", borderRadius: 14,
      border: `1px solid ${COL.border}`, marginBottom: 16,
    }}>
      <div style={{ fontSize: 15, fontWeight: 700, color: COL.text, lineHeight: 1.4 }}>
        {item.prompt}
      </div>
      {sub}
      {control}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   SECTION SCREEN — eine Section pro Bildschirm
   ════════════════════════════════════════════════════════════════════ */
function SectionScreen({ section, responses, setResponses, onNext, onBack, canBack, sectionIdx, totalSections }) {
  const allAnswered = useMemo(() => {
    return section.items.every(item => {
      // FollowUp: wenn Radio mit followUp und Wert matched, muss followUp auch beantwortet sein
      const r = responses[item.id];
      if (item.followUp) {
        const mainVal = r;
        const followUpRequired = mainVal === item.followUp.ifValue;
        if (followUpRequired && responses[item.followUp.id] == null) return false;
      }
      if (item.allowOther) {
        if (!r) return false;
        const main = r.main !== undefined ? r.main : r;
        if (main === "andere" && (!r.other || !r.other.trim())) return false;
        return main != null;
      }
      if (item.type === "open") return r != null && r.trim().length > 0;
      return r != null && r !== "";
    });
  }, [section, responses]);

  const setOne = (id, v) => setResponses(prev => ({ ...prev, [id]: v }));

  return (
    <div className="fade-in" style={{ padding: "18px 18px 80px" }}>
      <div style={{ fontSize: 11, color: COL.textLight, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>
        Abschnitt {sectionIdx + 1} von {totalSections}
      </div>
      <div style={{ fontSize: 22, fontWeight: 800, color: COL.blueDark, marginBottom: section.intro ? 6 : 14, lineHeight: 1.2 }}>
        {section.titel}
      </div>
      {section.intro && (
        <p style={{ fontSize: 14, color: COL.textMuted, lineHeight: 1.55, marginBottom: 18 }}>
          {section.intro}
        </p>
      )}

      {section.items.map(item => {
        const showFollowUp = item.followUp && responses[item.id] === item.followUp.ifValue;
        return (
          <React.Fragment key={item.id}>
            <ItemCard item={item} value={responses[item.id]} onChange={v => setOne(item.id, v)}
              sectionHints={section.sliderHints || section.likertHints} />
            {showFollowUp && (
              <ItemCard item={item.followUp} value={responses[item.followUp.id]}
                onChange={v => setOne(item.followUp.id, v)} />
            )}
          </React.Fragment>
        );
      })}

      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 24, gap: 12 }}>
        {/* Bewusst KEIN Zurück — laut Uni-Auftrag "nach Abgabe nicht zurückklicken" */}
        <div />
        <Btn primary disabled={!allAnswered} onClick={onNext}>
          {sectionIdx + 1 === totalSections ? "Fertig" : "Weiter →"}
        </Btn>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   PSEUDONYM-BAUER
   ════════════════════════════════════════════════════════════════════ */
function PseudonymBuilder({ initial, onComplete, intro }) {
  const [mutter, setMutter] = useState((initial || "").substr(0, 2));
  const [ort, setOrt] = useState((initial || "").substr(2, 2));
  const [tag, setTag] = useState((initial || "").substr(4, 2));

  const pseudonym = (mutter + ort + tag).toLowerCase();
  const complete = mutter.length === 2 && ort.length === 2 && /^\d{2}$/.test(tag);

  const inputStyle = {
    padding: "12px 14px", border: `2px solid ${COL.border}`, borderRadius: 12,
    fontSize: 22, fontWeight: 800, width: 70, textAlign: "center",
    textTransform: "lowercase", letterSpacing: 2, color: COL.text,
  };

  return (
    <div className="fade-in" style={{ padding: "18px 18px 80px" }}>
      <div style={{ fontSize: 22, fontWeight: 800, color: COL.blueDark, marginBottom: 6, lineHeight: 1.2 }}>
        {intro.titel}
      </div>
      <p style={{ fontSize: 14, color: COL.textMuted, lineHeight: 1.55, marginBottom: 24, whiteSpace: "pre-wrap" }}>
        {intro.text}
      </p>

      <div style={{ background: "#f8fafc", border: `1px solid ${COL.border}`, borderRadius: 14, padding: 18 }}>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COL.text, marginBottom: 6 }}>
            1) Letzte 2 Buchstaben vom Vornamen deiner Mutter
          </div>
          <div style={{ fontSize: 12, color: COL.textLight, marginBottom: 8 }}>
            Beispiel: bei „Barbara“ → <code>ra</code>
          </div>
          <input value={mutter} onChange={e => setMutter(e.target.value.toLowerCase().replace(/[^a-zäöüß]/g, "").slice(0, 2))}
            placeholder="--" maxLength={2} style={inputStyle} />
        </div>

        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COL.text, marginBottom: 6 }}>
            2) Erste 2 Buchstaben deines Geburtsortes
          </div>
          <div style={{ fontSize: 12, color: COL.textLight, marginBottom: 8 }}>
            Beispiel: „Osnabrück“ → <code>os</code>
          </div>
          <input value={ort} onChange={e => setOrt(e.target.value.toLowerCase().replace(/[^a-zäöüß]/g, "").slice(0, 2))}
            placeholder="--" maxLength={2} style={inputStyle} />
        </div>

        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COL.text, marginBottom: 6 }}>
            3) Der Tag deines Geburtsdatums (immer zweistellig)
          </div>
          <div style={{ fontSize: 12, color: COL.textLight, marginBottom: 8 }}>
            Beispiel: 8. Juli → <code>08</code>
          </div>
          <input value={tag} onChange={e => setTag(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))}
            placeholder="--" maxLength={2} style={inputStyle} inputMode="numeric" />
        </div>

        <div style={{ marginTop: 24, padding: 16, background: "#eef2ff", borderRadius: 12, textAlign: "center" }}>
          <div style={{ fontSize: 11, color: COL.textMuted, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>
            Dein Code
          </div>
          <div style={{
            fontSize: 32, fontWeight: 900, color: complete ? COL.blue : COL.textLight,
            letterSpacing: 4, fontFamily: "monospace",
          }}>
            {pseudonym.padEnd(6, "•")}
          </div>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 24 }}>
        <Btn primary disabled={!complete} onClick={() => onComplete(pseudonym)}>
          Los geht's →
        </Btn>
      </div>
    </div>
  );
}

   ════════════════════════════════════════════════════════════════════ */
function SchulcodeEntry({ rolle, onSubmit, checking, error, initial }) {
  const [code, setCode] = useState(initial || "");
  const submit = () => onSubmit(code);
  return (
    <div className="fade-in" style={{ padding: "48px 20px 60px", textAlign: "center" }}>
      <div style={{ fontSize: 48, marginBottom: 8 }}>🎫</div>
      <div style={{ fontSize: 24, fontWeight: 900, color: COL.blueDark, marginBottom: 8 }}>
        {rolle === "schueler" ? "Hi! Schön, dass du da bist." : "Hallo!"}
      </div>
      <p style={{ fontSize: 14, color: COL.textMuted, lineHeight: 1.55, maxWidth: 380, margin: "0 auto 24px" }}>
        {rolle === "schueler"
          ? "Tipp den Code ein, den du von deiner Lehrkraft bekommen hast."
          : "Bitte gib den Code ein, den ihr für eure Schule bekommen habt."}
      </p>
      <input value={code}
        onChange={e => setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12))}
        onKeyDown={e => { if (e.key === "Enter" && code.trim()) submit(); }}
        placeholder="z.B. ABC1234"
        autoFocus
        style={{
          padding: "16px 20px", border: `2px solid ${error ? "#dc2626" : COL.border}`, borderRadius: 14,
          fontSize: 24, fontWeight: 800, textAlign: "center", fontFamily: "monospace",
          letterSpacing: 4, color: COL.blue, width: "100%", maxWidth: 280, boxSizing: "border-box",
          textTransform: "uppercase",
        }}
      />
      {error && <div style={{ color: "#dc2626", fontSize: 13, fontWeight: 600, marginTop: 12, maxWidth: 380, margin: "12px auto 0", lineHeight: 1.4 }}>{error}</div>}
      <div style={{ marginTop: 24 }}>
        <Btn primary disabled={checking || !code.trim()} onClick={submit}>
          {checking ? "Prüfe…" : "Weiter →"}
        </Btn>
      </div>
    </div>
  );
}

function WelcomeScreen({ intro, schule, klasse, rolle, phase, onStart }) {
  const isPost = phase === "post";
  return (
    <div className="fade-in" style={{ padding: "32px 18px 80px", textAlign: "center" }}>
      <div style={{ fontSize: 56, marginBottom: 8 }}>{rolle === "schueler" ? "👋" : "🙏"}</div>
      <div style={{ fontSize: 26, fontWeight: 900, color: COL.blueDark, marginBottom: 12, lineHeight: 1.2 }}>
        {isPost ? "Schön, dass du wieder da bist." : intro.titel}
      </div>
      {/* Schul-Chip bewusst nicht angezeigt: Lehrer/Schüler wissen, in welcher Schule sie sind,
          und im Tester-Modus mit "Test-Schule" wirkt das nur verwirrend. Kontext wandert per
          Pseudonym + schule_id intern in die DB, das reicht. */}
      <p style={{ fontSize: 15, color: COL.textMuted, lineHeight: 1.6, textAlign: "left", whiteSpace: "pre-wrap", maxWidth: 520, margin: "0 auto 24px" }}>
        {isPost
          ? "Wir möchten dir jetzt die gleichen Fragen wie beim ersten Mal stellen. So können wir sehen, was sich verändert hat. Antworte wieder ehrlich und spontan — wie es heute für dich passt."
          : intro.text}
      </p>
      <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 12, padding: "12px 16px", maxWidth: 480, margin: "0 auto 28px", textAlign: "left" }}>
        <div style={{ fontSize: 12, color: "#15803d", fontWeight: 700, marginBottom: 4 }}>🔒 Anonym</div>
        <div style={{ fontSize: 13, color: "#166534", lineHeight: 1.5 }}>
          Niemand sieht deine Antworten persönlich. Wir nutzen einen Code, den nur du selbst zusammenbauen kannst — der ersetzt deinen Namen.
        </div>
      </div>
      <Btn primary onClick={onStart}>Los geht's →</Btn>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   DONE SCREEN
   ════════════════════════════════════════════════════════════════════ */
function DoneScreen({ outro, rolle, onContinueToGame, gameUrl }) {
  return (
    <div className="fade-in" style={{ padding: "48px 18px", textAlign: "center" }}>
      <div style={{ fontSize: 72, marginBottom: 16 }}>✨</div>
      <div style={{ fontSize: 28, fontWeight: 900, color: COL.blueDark, marginBottom: 12 }}>
        {outro.titel}
      </div>
      <p style={{ fontSize: 16, color: COL.textMuted, lineHeight: 1.6, maxWidth: 480, margin: "0 auto 32px" }}>
        {outro.text}
      </p>
      {rolle === "schueler" && gameUrl ? (
        <>
          <div style={{ background: "#eef2ff", border: `1px solid #c7d2fe`, borderRadius: 14, padding: "20px 16px", maxWidth: 480, margin: "0 auto 24px" }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: COL.blue, marginBottom: 8 }}>
              Okay, das war jetzt der trockene Teil.
            </div>
            <div style={{ fontSize: 15, color: COL.text, lineHeight: 1.5 }}>
              Jetzt geht das Swipen los — entdecke deinen Wertekompass im Spiel.
            </div>
          </div>
          <Btn primary onClick={onContinueToGame}>Zum Werte-Spiel →</Btn>
        </>
      ) : (
        <div style={{ fontSize: 14, color: COL.textLight, fontStyle: "italic" }}>
          Du kannst dieses Fenster jetzt schließen.
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════════════════════════════ */
function App() {
  // URL-Parameter parsen
  const params = new URLSearchParams(window.location.search);
  const rolleFromUrl = params.get("role") || params.get("rolle"); // schueler | lehrkraft
  const codeParam = params.get("code");      // Klassen-Code (Schüler)
  const schuleParam = params.get("schule");  // Schul-Code (Lehrer)
  const phaseParam = params.get("phase") || "pre"; // pre | post

  const [phase, setPhase] = useState("loading"); // loading | invalid | schulcode-entry | welcome | pseudonym | survey | done | error
  const [error, setError] = useState(null);
  const [schule, setSchule] = useState(null);
  const [klasse, setKlasse] = useState(null);
  const [pseudonym, setPseudonym] = useState(null);
  const [savedPseudonym, setSavedPseudonym] = useState(null); // aus localStorage
  const [responses, setResponses] = useState({});
  const [sectionIdx, setSectionIdx] = useState(0);
  const [saving, setSaving] = useState(false);
  const [codeCheckError, setCodeCheckError] = useState(null);
  const [codeChecking, setCodeChecking] = useState(false);

  const rolle = rolleFromUrl === "lehrkraft" || rolleFromUrl === "lehrer" ? "lehrkraft"
              : rolleFromUrl === "schueler" || rolleFromUrl === "schüler" ? "schueler"
              : null;

  const fragebogen = rolle === "lehrkraft" ? window.FRAGEBOGEN_LEHRKRAFT
                   : rolle === "schueler" ? window.FRAGEBOGEN_SCHUELER
                   : null;

  // LocalStorage Key für Wiedererkennung — bindet Pseudonym an Schul-Code
  const lsKey = useMemo(() => {
    if (!rolle || !schule) return null;
    return `vs_studie_${rolle}_${schule.code}`;
  }, [rolle, schule]);

  // Schul-Code-Lookup gemeinsam für Schüler + Lehrer
  const lookupSchule = async (code) => {
    setCodeChecking(true);
    setCodeCheckError(null);
    try {
      const trimmed = (code || "").trim().toUpperCase();
      if (!trimmed) { setCodeCheckError("Bitte Schul-Code eingeben"); setCodeChecking(false); return false; }
      const schulen = await supa.selectWhere("schulen", "*", { code: trimmed });
      if (!schulen.length) {
        setCodeCheckError(`Code „${trimmed}“ nicht gefunden. Stimmt der Code von der Lehrkraft?`);
        setCodeChecking(false); return false;
      }
      setSchule(schulen[0]);
      // localStorage prüfen für Pseudonym-Wiedererkennung
      try {
        const k = `vs_studie_${rolle}_${schulen[0].code}`;
        const stored = localStorage.getItem(k);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed.pseudonym) setSavedPseudonym(parsed.pseudonym);
        }
      } catch (e) {}
      setPhase("welcome");
      setCodeChecking(false);
      return true;
    } catch (e) {
      setCodeCheckError("Fehler beim Prüfen: " + e.message);
      setCodeChecking(false);
      return false;
    }
  };

  // Initial Load: URL-Parameter auswerten
  useEffect(() => {
    (async () => {
      try {
        if (!rolle) { setError("URL-Parameter ?role= fehlt (schueler oder lehrkraft)"); setPhase("invalid"); return; }
        if (!fragebogen) { setError("Kein Fragebogen für diese Rolle"); setPhase("invalid"); return; }

        // Schul-Code in URL? Direkt prüfen. Sonst Eingabemaske.
        const codeInUrl = schuleParam || codeParam; // codeParam für Rückwärts-Kompatibilität
        if (codeInUrl) {
          const ok = await lookupSchule(codeInUrl);
          if (!ok) { setPhase("schulcode-entry"); }
        } else {
          setPhase("schulcode-entry");
        }
      } catch (e) {
        setError("Fehler beim Laden: " + e.message);
        setPhase("error");
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const handleStart = () => {
    setPhase("pseudonym");
  };

  const handlePseudonymComplete = (pseudo) => {
    setPseudonym(pseudo);
    // localStorage updaten
    if (lsKey) {
      try { localStorage.setItem(lsKey, JSON.stringify({ pseudonym: pseudo, when: Date.now() })); } catch (e) {}
    }
    setPhase("survey");
    setSectionIdx(0);
    // Auch oben scrollen
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const handleNextSection = async () => {
    if (sectionIdx + 1 < fragebogen.sections.length) {
      setSectionIdx(sectionIdx + 1);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      // Fertig — speichern
      setSaving(true);
      try {
        const payload = {
          pseudonym,
          rolle,
          schule_id: schule ? schule.id : null,
          klasse_id: klasse ? klasse.id : null,
          messzeitpunkt: phaseParam,
          responses,
          fragebogen_version: fragebogen.meta.version,
        };
        // Versuche INSERT; bei Konflikt (unique) → UPDATE
        try {
          await supa.insertReturning("studie_responses", payload);
        } catch (e) {
          if (e.message.includes("409") || e.message.includes("duplicate")) {
            // Update statt Insert
            const filters = {
              pseudonym,
              rolle,
              messzeitpunkt: phaseParam,
            };
            if (schule) filters.schule_id = schule.id;
            await supa.update("studie_responses", filters, { responses, fragebogen_version: fragebogen.meta.version });
          } else {
            throw e;
          }
        }
        setPhase("done");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (e) {
        alert("Fehler beim Speichern: " + e.message + "\n\nDeine Antworten sind noch da. Versuch's nochmal.");
      } finally {
        setSaving(false);
      }
    }
  };

  // Übergabe an Wertetest: Schul-Code + Pseudonym. Klasse wählt der Schüler dort.
  const gameUrl = schule && pseudonym
    ? `../?schule=${encodeURIComponent(schule.code)}&pseudonym=${encodeURIComponent(pseudonym)}`
    : schule ? `../?schule=${encodeURIComponent(schule.code)}` : null;

  /* ─────────────────── RENDER ─────────────────── */

  if (phase === "loading") {
    return <div style={{ padding: 48, textAlign: "center", color: COL.textLight }}>Laden…</div>;
  }

  if (phase === "invalid" || phase === "error") {
    return (
      <div style={{ padding: 32, textAlign: "center" }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>⚠️</div>
        <div style={{ fontSize: 18, fontWeight: 800, color: COL.text, marginBottom: 12 }}>Etwas läuft noch nicht</div>
        <p style={{ color: COL.textMuted, lineHeight: 1.5 }}>{error}</p>
        <p style={{ color: COL.textLight, fontSize: 13, marginTop: 24 }}>
          Du brauchst den Link von deiner Lehrkraft. Falls der Link nicht klappt, melde dich kurz.
        </p>
      </div>
    );
  }

  if (phase === "schulcode-entry") {
    return <SchulcodeEntry rolle={rolle} onSubmit={lookupSchule}
      checking={codeChecking} error={codeCheckError} initial={schuleParam || codeParam} />;
  }

  if (phase === "welcome") {
    return <WelcomeScreen intro={fragebogen.intro} schule={schule} klasse={klasse}
      rolle={rolle} phase={phaseParam} onStart={handleStart} />;
  }

  if (phase === "pseudonym") {
    return <PseudonymBuilder initial={savedPseudonym} intro={fragebogen.pseudonym_intro}
      onComplete={handlePseudonymComplete} />;
  }

  if (phase === "survey") {
    const section = fragebogen.sections[sectionIdx];
    const totalSections = fragebogen.sections.length;
    return (
      <>
        <div style={{ padding: "12px 18px 0", background: "#fff", position: "sticky", top: 0, zIndex: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ fontSize: 12, color: COL.textLight, fontWeight: 700 }}>
              {fragebogen.meta.titel}
              {phaseParam === "post" && <span style={{ marginLeft: 8, color: COL.pink }}>· 2. Befragung</span>}
            </div>
            <div style={{ fontSize: 11, color: COL.textLight }}>{sectionIdx + 1} / {totalSections}</div>
          </div>
          <ProgressBar pct={((sectionIdx + 1) / totalSections) * 100} />
        </div>
        <SectionScreen section={section} responses={responses} setResponses={setResponses}
          sectionIdx={sectionIdx} totalSections={totalSections}
          onNext={handleNextSection} canBack={false} />
        {saving && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
            <div style={{ background: "#fff", padding: "20px 28px", borderRadius: 14, fontSize: 15 }}>
              Speichere deine Antworten…
            </div>
          </div>
        )}
      </>
    );
  }

  if (phase === "done") {
    return <DoneScreen outro={fragebogen.outro} rolle={rolle}
      onContinueToGame={() => { if (gameUrl) window.location.href = gameUrl; }}
      gameUrl={gameUrl}
    />;
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
