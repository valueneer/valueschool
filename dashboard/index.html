/* ═══════════════════════════════════════════════════════════════════
   Session-Handling: liest, speichert, refresht Supabase-Session
   ═══════════════════════════════════════════════════════════════════ */

function readSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.expires_at && parsed.expires_at * 1000 < Date.now()) return null;
    return parsed;
  } catch (e) { return null; }
}

function saveSession(s) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════════════
   Auth-Callback: URL-Fragment nach Magic-Link-Klick verarbeiten
   ═══════════════════════════════════════════════════════════════════ */

function extractSessionFromUrl() {
  try {
    const hash = window.location.hash.replace(/^#/, "");
    if (!hash) return null;
    const params = new URLSearchParams(hash);
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");
    const expires_at = parseInt(params.get("expires_at") || "0", 10);
    const type = params.get("type");
    if (access_token && refresh_token) {
      // Fragment aus URL entfernen
      window.history.replaceState({}, "", window.location.pathname);
      return { access_token, refresh_token, expires_at, type };
    }
    return null;
  } catch (e) { return null; }
}

/* ═══════════════════════════════════════════════════════════════════
   Supabase-Helper mit User-Session
   ═══════════════════════════════════════════════════════════════════ */

async function apiFetch(path, options, session) {
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${session ? session.access_token : SUPABASE_KEY}`,
    "Content-Type": "application/json",
    ...(options && options.headers || {}),
  };
  const r = await fetch(`${SUPABASE_URL}${path}`, { ...(options || {}), headers });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`${r.status} ${txt}`);
  }
  if (r.status === 204) return null;
  return r.json();
}

async function signInWithOtp(email) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      email,
      options: { emailRedirectTo: window.location.origin + "/dashboard/" },
    }),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.msg || err.error_description || `${r.status}`);
  }
  return true;
}

async function signOut(session) {
  try {
    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
    });
  } catch (e) {}
  clearSession();
}

async function getUserRolle(session) {
  const rows = await apiFetch(`/rest/v1/user_rollen?select=rolle,schule_id,klasse_id&limit=1`, {}, session);
  return rows && rows[0] ? rows[0] : null;
}

function LoginScreen({ onSent }) {

    } finally {
      setSending(false);
    }
  };

  return (
    <div className="fade-in" style={{

      padding: 20, background: "linear-gradient(135deg, #f8fafc, #eef2ff)",

          Dashboard-Login
        </div>

          E-Mail-Adresse
        </label>
        <input type="email" value={email} onChange={e => setEmail(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") submit(); }}
          placeholder="name@schule.de"
          style={{
            width: "100%", padding: "14px 16px", fontSize: 16,
            border: `2px solid ${error ? "#dc2626" : COLOR.border}`, borderRadius: 12,
            outline: "none", boxSizing: "border-box", marginBottom: 16,
          }}
        />
        {error && (
          <div style={{ color: "#dc2626", fontSize: 13, marginBottom: 16 }}>{error}</div>
        )}
        <Btn primary full disabled={sending || !email.trim()} onClick={submit}>
          {sending ? "Schicke Link…" : "Login-Link schicken"}
        </Btn>
        <div style={{ fontSize: 12, color: COLOR.textLight, marginTop: 20, lineHeight: 1.5 }}>
          Du bekommst eine E-Mail mit einem Link. Ein Klick reicht — kein Passwort nötig.
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════════════════════════════ */

function App() {
  const [phase, setPhase] = useState("boot"); // boot | login | linksent | loading | error | ready | norole
  const [session, setSession] = useState(null);
  const [user, setUser] = useState(null);
  const [rolle, setRolle] = useState(null);
  const [linkSentTo, setLinkSentTo] = useState("");
  const [error, setError] = useState("");

  // Session-Bootstrap: URL-Fragment oder localStorage
  useEffect(() => {
    const fromUrl = extractSessionFromUrl();
    if (fromUrl) {
      saveSession(fromUrl);
      setSession(fromUrl);
      setPhase("loading");
      return;
    }
    const stored = readSession();
    if (stored) {
      setSession(stored);
      setPhase("loading");
    } else {
      setPhase("login");
    }
  }, []);

  // Rolle nach Session laden
  useEffect(() => {
    if (!session || phase !== "loading") return;
    (async () => {
      try {
        // User-Info aus /auth/v1/user
        const r = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${session.access_token}`,
          },
        });
        if (!r.ok) {
          throw new Error("Session ungültig — bitte neu einloggen");
        }
        const userJson = await r.json();
        setUser(userJson);

        const rl = await getUserRolle(session);
        if (!rl) {
          setPhase("norole");
        } else {
          setRolle(rl);
          setPhase("ready");
        }
      } catch (e) {
        setError(e.message);
        clearSession();
        setPhase("error");
      }
    })();
  }, [session, phase]);

  const doLogout = async () => {
    if (session) await signOut(session);
    setSession(null); setUser(null); setRolle(null);
    setPhase("login");
  };

  if (phase === "boot") return null;

  if (phase === "login") {
    return <LoginScreen onSent={(email) => { setLinkSentTo(email); setPhase("linksent"); }} />;
  }

  if (phase === "linksent") {
    return <MagicLinkSent email={linkSentTo} onBack={() => setPhase("login")} />;
  }

  if (phase === "loading") {
    return (
      <>
        {user && <TopBar user={user} rolle={rolle} onLogout={doLogout} />}
        <DashboardLoader />
      </>
    );
  }

  if (phase === "error") {
    return <DashboardError message={error} onRetry={() => setPhase("login")} />;
  }

  if (phase === "norole") {
    return (
      <>
        <TopBar user={user} rolle={null} onLogout={doLogout} />
        <NoRoleView user={user} onLogout={doLogout} />
      </>
    );
  }

  // phase === "ready"
  return (
    <>
      <TopBar user={user} rolle={rolle} onLogout={doLogout} />
      <div style={{ padding: 24, textAlign: "center", color: COLOR.textMuted }}>
        <div style={{ fontSize: 48, marginBottom: 12 }}>✨</div>
        <div style={{ fontSize: 20, fontWeight: 700, color: COLOR.blueDark, marginBottom: 8 }}>
          Login läuft. Dashboard-Inhalt kommt gleich.
        </div>
        <p style={{ maxWidth: 480, margin: "0 auto", lineHeight: 1.6 }}>
          Du bist eingeloggt als <strong>{user.email}</strong> mit der Rolle <strong>{rolle.rolle}</strong>.
          Der eigentliche Dashboard-Inhalt (Zahlen, Wortwolke, Vorher-Nachher) baue ich als Nächstes ein.
        </p>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
